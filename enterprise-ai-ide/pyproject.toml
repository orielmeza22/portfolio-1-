[project]
name = "enterprise-ai-ide"
version = "0.1.0"
description = "IDE empresarial con IA local (Ollama) - Alternativa a Cursor/Hermes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "ollama>=0.1.6",
    "httpx>=0.25.0",
    "aiofiles>=23.2.1",
    "watchfiles>=0.21.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.2",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.43",
    "python-multipart>=0.0.6",
    "psutil>=5.9.6",
    "cryptography>=41.0.7",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.11.0",
    "ruff>=0.1.8",
    "mypy>=1.7.1",
]

[project.optional-dependencies]
gui = [
    "pywebview>=4.4.1",
]
dev = [
    "pytest-cov>=4.1.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "api", "config"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
strict = true
ignore_missing_imports = true
